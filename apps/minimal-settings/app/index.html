<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Settings</h1>
        <p>Fast controls for this TV</p>
      </div>
      <button id="advanced-top" class="action focusable" type="button">Advanced LG settings</button>
    </header>

    <div class="columns">
      <section>
        <h2>Picture</h2>
        <div class="panel">
          <button class="setting choice-setting focusable" data-setting="pictureMode" type="button">
            <span class="copy"><strong>Picture mode</strong><small>Current input and signal</small></span>
            <span class="value">Loading…</span>
          </button>
          <button class="setting focusable" data-setting="backlight" type="button">
            <span class="copy"><strong>Panel brightness</strong><small>Light output</small></span>
            <span class="range"><i></i></span><span class="value">—</span>
          </button>
          <button class="setting focusable" data-setting="brightness" type="button">
            <span class="copy"><strong>Black level</strong><small>Shadow detail</small></span>
            <span class="range"><i></i></span><span class="value">—</span>
          </button>
          <button class="setting focusable" data-setting="contrast" type="button">
            <span class="copy"><strong>Contrast</strong><small>White level</small></span>
            <span class="range"><i></i></span><span class="value">—</span>
          </button>
          <button class="setting focusable" data-setting="colorTemperature" type="button">
            <span class="copy"><strong>Colour temperature</strong><small>Cooler or warmer whites</small></span>
            <span class="range"><i></i></span><span class="value">—</span>
          </button>
          <button class="setting choice-setting focusable" data-setting="energySaving" type="button">
            <span class="copy"><strong>Energy saving</strong><small>Automatic panel dimming</small></span>
            <span class="value">Loading…</span>
          </button>
        </div>
      </section>

      <section>
        <h2>Sound and system</h2>
        <div class="panel">
          <button class="setting choice-setting focusable" data-setting="soundMode" type="button">
            <span class="copy"><strong>Sound mode</strong><small>Applies to the current output</small></span>
            <span class="value">Loading…</span>
          </button>
          <button class="setting choice-setting focusable" data-setting="quickStartMode" type="button">
            <span class="copy"><strong>Quick Start+</strong><small>Faster wake-up, higher standby use</small></span>
            <span class="value">Loading…</span>
          </button>
          <div class="info-card">
            <strong>More settings</strong>
            <p>Network, Bluetooth, inputs, accessibility, updates and tuning remain in LG Settings.</p>
            <button id="advanced" class="action focusable" type="button">Open LG Settings</button>
          </div>
        </div>
      </section>
    </div>

    <footer>
      <span><b>↑ ↓</b> Move</span>
      <span><b>← →</b> Change</span>
      <span><b>OK</b> Next</span>
      <span><b>Back</b> Home</span>
      <span id="status">Reading current settings…</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
